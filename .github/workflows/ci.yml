name: AttendEase CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attendease-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install and build Next.js app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-time placeholders only; CI does not connect to a real database.
      MONGODB_URI: mongodb://127.0.0.1:27017/attendease_ci
      MONGODB_DB: attendease_ci
      DEFAULT_ADMIN_PASSWORD: ci-only-placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
